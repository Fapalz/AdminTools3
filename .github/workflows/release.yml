name: Publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check transport archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          asset="dist/admintools3-${version}.transport.zip"
          test -f "$asset"
          unzip -tq "$asset"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Publish on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" "$ASSET" --verify-tag --title "$TAG" --generate-notes
